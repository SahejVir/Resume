<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: black;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Resume</h1>
    <p>Open the PDF resume using the button below.</p>
    <a href="./Resume_CV.pdf" target="_blank" rel="noopener noreferrer">Open Resume</a>
  </div>
</body>
</html>
